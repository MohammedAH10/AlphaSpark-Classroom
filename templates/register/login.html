{% extends 'base/base.html' %} {% block content %}
<style>
    :root {
        --electric-blue: #0066ff;
        --milk-orange: #ffb347;
        --electric-blue-dark: #0052cc;
        --milk-orange-light: #ffcc80;
        --white: #ffffff;
        --light-bg: #f8f9fa;
        --text-dark: #333333;
    }

    .login-wrapper {
        min-height: 90vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .login-container {
        display: flex;
        flex-wrap: wrap;
        max-width: 1100px;
        width: 100%;
        background-color: var(--white);
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        overflow: hidden;
    }

    .login-form-section {
        flex: 1;
        min-width: 300px;
        padding: 50px 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .login-image-section {
        flex: 1;
        min-width: 300px;
        background: linear-gradient(
            135deg,
            var(--electric-blue) 0%,
            var(--milk-orange) 100%
        );
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px;
        position: relative;
    }

    .login-image-section img {
        max-width: 100%;
        height: auto;
        position: relative;
        z-index: 1;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    h2 {
        color: var(--electric-blue);
        font-size: 2rem;
        margin-bottom: 30px;
        font-weight: 700;
        text-align: center;
    }

    .messages {
        margin-bottom: 20px;
    }

    .alert {
        background-color: var(--milk-orange-light);
        color: var(--text-dark);
        border: none;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        position: relative;
    }

    .close {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        font-size: 1.5rem;
        cursor: pointer;
        color: var(--text-dark);
        opacity: 0.7;
        transition: opacity 0.3s ease;
    }

    .close:hover {
        opacity: 1;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-control {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 1rem;
        transition: all 0.3s ease;
        box-sizing: border-box;
    }

    .form-control:focus {
        outline: none;
        border-color: var(--electric-blue);
        box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.1);
    }

    .form-control::placeholder {
        color: #999999;
    }

    .btn-primary {
        width: 100%;
        padding: 14px;
        background: linear-gradient(
            135deg,
            var(--electric-blue) 0%,
            var(--milk-orange) 100%
        );
        color: var(--white);
        border: none;
        border-radius: 8px;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(0, 102, 255, 0.3);
    }

    hr {
        margin: 25px 0;
        border: none;
        border-top: 1px solid #e0e0e0;
    }

    .text-center {
        text-align: center;
        color: var(--text-dark);
        font-size: 0.95rem;
    }

    .text-center a {
        color: var(--electric-blue);
        text-decoration: none;
        font-weight: 600;
        transition: color 0.3s ease;
    }

    .text-center a:hover {
        color: var(--milk-orange);
        text-decoration: underline;
    }

    /* Tablet styles */
    @media (max-width: 992px) {
        .login-form-section {
            padding: 40px 30px;
        }

        h2 {
            font-size: 1.7rem;
        }

        .login-image-section {
            min-height: 300px;
        }
    }

    /* Mobile styles */
    @media (max-width: 768px) {
        .login-wrapper {
            padding: 10px;
        }

        .login-container {
            flex-direction: column;
        }

        .login-form-section {
            padding: 30px 20px;
            order: 1;
        }

        .login-image-section {
            order: 2;
            min-height: 250px;
            padding: 30px;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .form-control {
            padding: 12px 14px;
            font-size: 0.95rem;
        }

        .btn-primary {
            padding: 12px;
            font-size: 1rem;
        }
    }

    /* Small mobile styles */
    @media (max-width: 480px) {
        .login-form-section {
            padding: 25px 15px;
        }

        h2 {
            font-size: 1.4rem;
        }

        .login-image-section {
            min-height: 200px;
            padding: 20px;
        }

        .form-control {
            font-size: 0.9rem;
        }
    }
</style>

<div class="login-wrapper">
    <div class="login-container">
        <div class="login-form-section">
            <h2>Login Now</h2>

            <div class="messages">
                {% for message in messages %}
                <div
                    class="alert alert-primary"
                    {%
                    if
                    message.tags
                    %}class="{{ message.tags }}"
                    {%
                    endif
                    %}
                >
                    {{ message }}
                    <button
                        type="button"
                        class="close"
                        data-dismiss="alert"
                        aria-label="Close"
                    >
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                {% endfor %}
            </div>

            <form action="{% url 'login' %}" method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <input
                        type="text"
                        class="form-control"
                        name="username"
                        placeholder="Your Username"
                        required
                    />
                </div>
                <div class="form-group">
                    <input
                        type="password"
                        class="form-control"
                        name="password"
                        placeholder="Your Password"
                        required
                    />
                </div>

                <button type="submit" class="btn-primary">Login Now</button>
            </form>

            <hr />

            <div class="text-center">
                Don't have an account?
                <a href="{% url 'signup' %}">Create here</a>
            </div>
        </div>

        <div class="login-image-section">
            {% load static %}
            <img src="{% static 'others/classroom1.png' %}" alt="Classroom" />
        </div>
    </div>
</div>

{% endblock %}
